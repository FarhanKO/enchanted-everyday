# The licensed music beds (see README.md). One [[track]] per file in this folder.
#
# moods: what the track can play under, strongest first: calm, wonder, mystery, tension, sorrow,
#        warm, playful. The storyboard gives every shot a mood; the render plays one track per run
#        of shots with the same mood, preferring a track whose first mood it is.
# pole:  night | day | any, the look it suits best.
# credit: the attribution line posted with every episode that uses the track (CC BY needs it, and
#        Scott Buckley's Content ID claims YouTube videos whose description lacks it).
#
# Scott Buckley's library, picked 2026-10-12 from his own descriptions for soft, drum-free,
# fairy-tale moods: https://www.scottbuckley.com.au/library/ (CC BY 4.0, commercial use allowed
# with credit; terms: https://www.scottbuckley.com.au/library/using-this-music/).

