# ================================================================ the chosen sound (2026-10-20)
#
# Farhan's references: Indila's "Love Story" (orchestral, slowed + reverb, epic dark cinematic), "Golden Brown"
# mashups, Enya's "Caribbean Blue": slow melancholic waltzes, harp, strings, music box, a dark build. Those are
# copyrighted, so these free-licence tracks carry the same feel. `prefer = true`: the render plays them first
# whenever one fits the mood and hasn't been heard lately; Scott Buckley fills in otherwise.
#
# Kevin MacLeod, incompetech.com, CC BY 4.0 (commercial use with credit, the attribution code below verbatim).
# He doesn't register them with YouTube Content ID; a false claim by a third party is disputed with the credit.

