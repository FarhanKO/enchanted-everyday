name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # CI never posts for real: no platform secrets exist in this job
      - run: pytest --cov=engine --cov=bot --cov-report=term-missing

  build:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t content-engine:ci .
      - name: smoke test the image
        run: docker run --rm content-engine:ci engine --help

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: skip until the VPS is provisioned
        if: env.VPS_HOST == ''
        run: echo "VPS_HOST secret not set; skipping deploy"
      - name: deploy over SSH
        if: env.VPS_HOST != ''
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh "$VPS_USER@$VPS_HOST" "/opt/content-engine/scripts/deploy.sh ${GITHUB_SHA}"
