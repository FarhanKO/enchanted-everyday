[project]
name = "content-engine"
version = "0.1.0"
description = "Daily short-video pipeline: story -> script -> render -> human approval -> cross-post."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "anthropic>=0.70",
    "boto3>=1.35,<2",
    "cronsim>=2.6,<3",  # the catch-up check after a missed DAILY_RUN_CRON (engine/flows.py)
    "fastembed>=0.7,<1",  # local MiniLM embeddings over ONNX, no torch
    "feedparser>=6.0,<7",
    "httpx>=0.27,<1",
    "numpy>=2.0,<3",  # audio mixing and the sounds made in code (engine/media)
    "pgvector>=0.3,<1",
    "pillow>=11.0,<14",  # frame preparation and the thumbnail (engine/media/render.py)
    "prefect>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-telegram-bot>=21.6,<23",
    "sqlalchemy>=2.0.36,<3",
    "tenacity>=9.0,<10",
]

[project.optional-dependencies]
# Heavy ML deps arrive with the phases that need them, so the image stays small. The render
# itself is ffmpeg (installed in the image) plus numpy and Pillow above.
ml = [
    "sentence-transformers>=3.3",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
engine = "engine.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "bot*"]

[tool.setuptools.package-data]
engine = ["db/migrations/*", "db/migrations/versions/*", "llm/prompts/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a Postgres+pgvector database (TEST_DATABASE_URL)"]
addopts = "-ra"
