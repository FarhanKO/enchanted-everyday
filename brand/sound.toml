# The sonic identity: the sound each recurring character is recognised by. The visual director puts a
# character's `presence` sound in the sfx of the shot where they first appear, and the render stage lays
# their motif under that moment.
#
# Episodes end without a sound signature (Farhan, 2026-10-20): no bell and no spoken sign-off. The last
# image holds while the story's closing message appears in italics (the script's closing_line), and the
# music carries it out. The Shopkeeper has no sound of her own any more.

[characters.fann]
presence = "fann_hum"
presence_note = "Fann hums the same three falling notes under his breath when he is alone or tired, an old tune from the dream of the tree and the sea"
motif = "low felt piano, the same three falling notes, slow"

[characters.tina]
presence = "tina_dupatta"
presence_note = "the soft rustle of her dupatta settling, close to the microphone"
motif = "a small music box playing a rising four-note phrase, the answer to Fann's three falling notes"
