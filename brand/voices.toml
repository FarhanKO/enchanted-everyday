# The voice cast. Every spoken line is voiced through OpenRouter's speech API with one of ElevenLabs'
# 21 built-in voices (Farhan, 2026-10-10): no subscription, ~$0.04 an episode. Built-in voices can't be
# cloned or tuned there, so character comes from the voice choice, Eleven v4's inline audio tags
# ([softly], [whispers], [sighs], [hesitates]) and, for children, a pitch lift done locally in ffmpeg.
#
# Picked from ElevenLabs' catalog tags (accent, age, tone, use case) before hearing them; audition with
# `python scripts/voice_samples.py` and swap any `voice` below. ElevenLabs says its default voices are
# replaced by new ones after 2026-12-31: when that happens, only this file changes.
#
# Allowed voices: adam alice bella bill brian callum charlie chris daniel eric george harry jessica laura
# liam lily matilda river roger sarah will

model = "elevenlabs/eleven-v4"
fallback_model = "elevenlabs/eleven-v3"

[narrator]
voice = "george"
backup = "brian"
why = "British, middle-aged, warm, made for narration: the quietly confident 2 AM storyteller. Brian, deep and American, if George sounds too formal."
sample = "[softly] There are places in this world that do not appear on any map. [short pause] Sometimes, they only open for people who are carrying something they cannot say out loud."

[fann]
voice = "brian"
backup = "adam"
why = "Confident and deep. American, so he never blurs with the British narrator. Adam is firmer and more commanding."
sample = "Sell my dreams? [short laugh] Fine. Name your price, and let's see if you can afford them."

[tina]
voice = "jessica"
backup = "lily"
why = "Young, expressive and conversational: sweet, with room for shyness through [softly] and [hesitates]. Lily is warmer and more grown-up."
sample = "[hesitates] I... I didn't think anyone would notice. [softly] But thank you. Really."

[shopkeeper]
voice = "lily"
backup = "alice"
why = "Warm British narrator voice, slowed and hushed for the ageless keeper of the Midnight Shop. There is no elderly female voice among the 21."
sample = "[slowly] Everything here costs something, dear. [short pause] Most people pay without ever noticing."

[child_girl]
voice = "laura"
pitch_semitones = 3
why = "None of the 21 voices is a child. Laura is young and bright; a +3 semitone lift in ffmpeg (rubberband) makes her about eight."
sample = "[excited whisper] Is the moon lonely up there? Can we wave to it?"

[child_boy]
voice = "liam"
pitch_semitones = 3
why = "Young and energetic, lifted +3 semitones the same way."
sample = "I wasn't scared. [short pause] Okay, maybe a little."

[old_man]
voice = "bill"
why = "Old, trustworthy narration voice: grandfathers, the Old Tree, anyone who has seen it all."
sample = "[slowly] I have watched this city grow for three hundred winters."

[woman]
voice = "sarah"
why = "Young, mature and reassuring: mothers, friends, strangers who help."
sample = "Sit down. You look like you've been carrying that for a long time."

[young_man]
voice = "will"
why = "Young, friendly and relaxed: friends, brothers, passers-by."
sample = "Hey, you dropped this. [short pause] Wait, is that a key made of glass?"

[stranger]
voice = "callum"
why = "Intense, made for characters: villains, deal-makers, the uncanny."
sample = "[low] Everyone wants something back eventually."

[spirit]
voice = "river"
why = "Neutral and calm, neither male nor female: the Moonkeeper, talking objects, things that aren't quite people."
sample = "[whispers] You may borrow the light. Just return it before dawn."
